name: Meta Agent Tools
description: >-
  A registry/catalog of MCP servers, agent skills and plugins. It aggregates MCP metadata from the Official MCP
  Registry, Smithery and Casdoor, and public skill dumps, exposing a REST/HTTP API, a hosted MCP server, an llms.txt
  agent guide and a public OpenAPI 3.1 contract. Portuguese-language service based in Brazil. Canonical host is
  agentalog.com — the originally submitted classificado.app.br permanently redirects (301) every path there.
