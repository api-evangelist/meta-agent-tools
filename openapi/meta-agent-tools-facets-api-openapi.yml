openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Facets API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Facets
paths:
  /api/facets:
    get:
      operationId: get_api_facets
      summary: The whole catalog's counts by kind, provenance, category and repository state
      description: 'Exists to build a filter without sweeping the listings: there are tens of thousands, and asking for the list just to count would be expensive. Each dimension ignores its own selection and respects the other filters. These counts describe the search. For catalog tab totals, use the unfiltered response. Language and license come from repository metadata. Also brings `topico_inferido`, deduced from the repositories.

        Returns: { total, facetas, topico_inferido, interpretacao, publicador?, api }'
      security: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: The same text query as /api/listings.
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: Resource kind.
      - name: language
        in: query
        required: false
        schema:
          type: string
        description: Repository code languages, comma-separated. Preserve case, for example Python.
      - name: license
        in: query
        required: false
        schema:
          type: string
        description: Repository licenses, comma-separated, for example MIT,Apache-2.0. Preserve case.
      - name: min_stars
        in: query
        required: false
        schema:
          type: integer
        description: Minimum repository stars, from 0 to 999999999.
      - name: min_forks
        in: query
        required: false
        schema:
          type: integer
        description: Minimum forks of a repository with collected activity data.
      - name: min_prs
        in: query
        required: false
        schema:
          type: integer
        description: Minimum open pull requests of a repository with collected activity data.
      - name: max_prs
        in: query
        required: false
        schema:
          type: integer
        description: Maximum open pull requests of a repository with collected activity data.
      - name: added_since
        in: query
        required: false
        schema:
          type: string
        description: Catalog arrival on or after YYYY-MM-DD. This is not the original publication date.
      - name: pushed_since
        in: query
        required: false
        schema:
          type: string
        description: Last repository code push on or after YYYY-MM-DD.
      - name: has_code
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
        description: Whether a repository link is available. This does not certify the code.
      responses:
        '200':
          description: '{ total, facetas, topico_inferido, interpretacao, publicador?, api }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facetas'
      tags:
      - Facets
components:
  schemas:
    Facetas:
      type: object
      properties:
        total:
          type: integer
          description: Live listings in the catalog.
        facetas:
          type: object
          description: 'Map of facet → list of `{ v, n }` (value and count): `kind`, `origin`, `category`, `repo_estado`, `transporte`…'
        topico_inferido:
          type: object
          description: Topics deduced from the repositories, with the count of each.
        interpretacao:
          type: object
          description: Same query understanding as `/api/listings`, so the counts match the list.
          nullable: true
        publicador:
          type: object
          description: '`{ ns, n, stars }` when the slice has exactly one `ns` — the publisher''s live listings and their stars summed, regardless of the other filters (the publisher page header); `null` otherwise. Responses cached before 13/09/2026 may not carry the key yet.'
          nullable: true
        api:
          type: string
          description: Absolute URL of this route.
      required:
      - total
      - facetas
      - topico_inferido
      - interpretacao
      - api
      description: The whole catalog's breakdowns, to build a filter without sweeping the listings.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - ai-agents
  - mcp
  - directory
  docs:
    homepage: https://agentalog.com/
    apiReference: https://agentalog.com/developers
    llms: https://agentalog.com/llms.txt
