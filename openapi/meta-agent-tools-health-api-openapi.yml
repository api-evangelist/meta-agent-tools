openapi: 3.2.0
info:
  title: Meta Agent Tools Health API
  version: 1.0.0
  description: Meta Agent Tools — registry of MCP servers, skills and plugins.
servers:
- url: https://agentalog.com
tags:
- name: Health
paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness and the commit deployed right now — it is how the smoke waits for its…
      description: 'Returns: { ok, app, build, ts }'
      security: []
      responses:
        '200':
          description: '{ ok, app, build, ts }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the Worker answers.
                  app:
                    type: string
                    description: Product name.
                  build:
                    type: string
                    description: Deployed commit; CI passes the short SHA on deploy.
                  ts:
                    type: string
                    description: Time of the response (UTC, ISO-8601).
                required:
                - ok
                - app
                - build
                - ts
      tags:
      - Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_…, session sess_… or ADMIN_TOKEN.
