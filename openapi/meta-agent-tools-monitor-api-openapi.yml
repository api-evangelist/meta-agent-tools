  /api/monitor/avisos/iniciar:
    post:
      operationId: post_api_monitor_avisos_iniciar
      summary: Revalidate the reservation before one mail attempt
      description: 'Private and no-store. Account epoch, project, installation and recorded notice evidence must remain valid. Records send intent and reserves one of 512 shared delivery attempts per UTC day in the same transaction before authorizing mail. Retries consume this same budget. Exhaustion preserves preparation and returns 429 without authorizing a send. Missing or invalid budget returns 503. Returns only catalog links still active from the committed event; the list can be empty for an unlinked change or native observation. It does not send mail or grant tool approval. After two minutes, interrupted preparation can be recovered and send intent without a receipt is eligible for uncertain recovery. Hourly maintenance performs bounded recovery. Uncertain sends are not automatically resent.

        Returns: { autorizado, vigias }'
      security:
      - monitorNotices: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projeto:
                  type: string
                  description: 'Reserved private project ID: 32 hexadecimal characters.'
                numero:
                  type: integer
                  description: Reserved positive committed event number.
                lease:
                  type: string
                  description: 'Private reservation proof: 64 hexadecimal characters.'
