        '405':
          description: Only the declared method is permitted.
        '409':
          description: The observed candidate, sequence or review version changed; coverage is incomplete; or a cursor is in the future.
        '413':
          description: Body exceeds 4 KiB.
        '415':
          description: Content-Type must be application/json.
        '429':
          description: The shared daily registration budget is exhausted.
        '503':
          description: Review is unconfigured or unavailable. No permission is granted.
      tags:
      - Monitor
