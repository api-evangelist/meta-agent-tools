  /api/monitor/projetos/{projeto}/instalacoes/{instalacao}/revisoes:
    get:
      operationId: get_api_monitor_projetos_by_projeto_instalacoes_by_instalacao_revisoes
      summary: Compare observed candidates with your reviewed reference and read decision…
      description: 'Private and no-store. Requires the human account cookie. Expired or revoked current-epoch installations remain readable. This read does not authorize a new decision or signed policy. One request reads at most 500 current candidates and 500 reviewed references. Each candidate includes the server''s fingerprint, comparison state and changed fields. Incomplete coverage cannot grant approval. No installation secret or local path is returned. Read at most five audit receipts after the cursor. Future cursors fail. This reads no public catalog and writes nothing. Available only when the optional review service is configured.

        Returns: { esquema, instalacao, sequencia, versao, candidatos, revisoes, historico, cursor, fim }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: 'Private owned project ID: 32 lower-case hexadecimal characters.'
      - name: instalacao
        in: path
        required: true
        schema:
          type: string
        description: 'Current-epoch installation in this project: 32 hexadecimal characters. A decision requires an active credential.'
      - name: desde
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Last consumed decision number, from 0 to 600.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 5
        description: Maximum audit receipts in this page, from 1 to 5.
      responses:
        '200':
          description: '{ esquema, instalacao, sequencia, versao, candidatos, revisoes, historico, cursor, fim }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: Review state contract.
                    enum:
                    - revisoes-inventario-1
                  instalacao:
                    type: string
                    description: The owned installation.
                  sequencia:
                    type: integer
                    description: Current inventory sequence. Send this exact number in a decision.
                  versao:
                    type: integer
                    description: Current review version. Send this exact number in a decision.
                  candidatos:
                    type: array
                    items:
                      type: object
                    description: 'At most 500 records: item, candidato, estado and campos. Each item uses inventario-1 metadata, including selected configuration hashes and fixed permission categories. estado is novo, igual, alterado or incompleto. campos identifies changed captured metadata. Use candidato in the human decision; do not recompute it in the browser.'
                  revisoes:
                    type: array
                    items:
                      type: object
                    description: At most 500 item/candidato/decisao/responsavel/decidido_em/numero records. Each item uses inventario-1 metadata. An observed upgrade preserves the previous reviewed reference.
                  historico:
                    type: array
                    items:
                      type: object
                    description: 'Up to five receipts: id, item, candidato, decisao, quando, numero and responsavel. No request hash or secret.'
                  cursor:
                    type: integer
                    description: Last returned receipt number. Use it as desde for the next page.
                  fim:
                    type: boolean
                    description: True at the current end of the audit.
                required:
                - esquema
                - instalacao
                - sequencia
                - versao
                - candidatos
                - revisoes
                - historico
                - cursor
                - fim
        '400':
          description: Invalid field, bounded JSON or cursor.
        '401':
          description: A human cookie is required. Reauthenticate within five minutes before a decision.
        '403':
          description: Origin or CSRF proof is invalid.
        '404':
          description: The owned active project or installation was not found.
        '405':
          description: Only the declared method is permitted.
        '409':
          description: The observed candidate, sequence or review version changed; coverage is incomplete; or a cursor is in the future.
        '429':
          description: The shared daily registration budget is exhausted.
        '503':
          description: Review is unconfigured or unavailable. No permission is granted.
      tags:
      - Monitor
    post:
      operationId: post_api_monitor_projetos_by_projeto_instalacoes_by_instalacao_revisoes
      summary: Approve exact observed content or suspend it with a durable human receipt
      description: 'Private and no-store. Requires a human cookie authenticated within five minutes, exact Origin and CSRF. Refuses installation bearer credentials and API keys. Recheck candidate fingerprint, inventory sequence and review version under the project lock. Partial coverage cannot grant approval. A suspension can retain a reviewed item after removal. Retry with the same ID and exact body to obtain the original receipt without writes. A changed body under the same ID fails. Limits: 500 references, 600 total decisions per installation, 2 MiB stored state, and the shared 512 registrations per day. No tool runs or is installed by this endpoint. A model result never grants permission.

        Returns: { id, item, candidato, decisao, quando, numero, responsavel }'
