openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Monitor API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Monitor
paths:
  /api/monitor/projetos:
    get:
      operationId: get_api_monitor_projetos
      summary: List your private agent projects and their human labels
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Basic accounts can create three projects. An active Team or Business pass permits ten, with three active installations per project. The response includes current limits and their expiry. After the pass ends, existing projects remain readable and exportable. Archived references and decisions are read only. New projects and installation credentials return to basic capacity. Separate single-slot purchases do not combine into this benefit. A guest or a wide API key cannot read projects.

        Returns: { projetos, limites }'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{ projetos, limites }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  projetos:
                    type: array
                    items:
                      type: object
                    description: 'Owned projects: id, nome, criado_em (Unix seconds) and apagando (pending erasure).'
                  limites:
                    type: object
                    description: 'Current capacity: projetos (3 or 10), instalacoes (3), expira_em (Unix seconds or null).'
                required:
                - projetos
                - limites
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
    post:
      operationId: post_api_monitor_projetos
      summary: Create a private project with a retry ID and a short label
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Use the same ID on retry. A replay keeps the original name and performs no new domain write. Labels must not contain local paths, control characters or secrets.

        Returns: { id }'
      security:
      - globalAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 32 lower-case hexadecimal characters, generated once per creation attempt.
                nome:
                  type: string
                  description: A short human label, from 1 to 80 characters. No file path or secret.
              required:
              - id
      responses:
        '200':
          description: '{ id }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The created or already owned project ID.
                required:
                - id
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/instalacoes:
    post:
      operationId: post_api_monitor_projetos_by_projeto_instalacoes
      summary: Issue one installation credential for this private project
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Requires authentication within five minutes and exact empty JSON. The secret is returned once; store its download privately with mode 0600. At most three active installations per project. If the account exceeds its current project capacity, renew the pass or delete excess projects before issuance. A new token expires within 30 days or at the active pass end, whichever comes first. It cannot approve, buy, create a project or issue another credential.

        Returns: { esquema, projeto, instalacao, token, expira_em }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ esquema, projeto, instalacao, token, expira_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: 'Credential contract version: credencial-1.'
                  projeto:
                    type: string
                    description: The credential's single private project.
                  instalacao:
                    type: string
                    description: The credential's single installation ID.
                  token:
                    type: string
                    description: Private mmi_ bearer secret, returned only by this issuance response.
                  expira_em:
                    type: integer
                    description: Expiry timestamp in Unix seconds.
                required:
                - esquema
                - projeto
                - instalacao
                - token
                - expira_em
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/inventario:
    get:
      operationId: get_api_monitor_projetos_by_projeto_inventario
      summary: Read the received inventory for your active installations
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Installation metadata and the preserved normalized reference. Null inventory means no reference has arrived. A partial scan does not remove prior items. Receiving metadata does not approve a tool or prove execution. With historico=1, return at most three current-epoch references: active installations first, then the most recent archived installations. Archived entries have ativa=false and are read only. This option does not authorize sends, links, approvals or signed policies. References become eligible for cleanup 45 days after credential expiry.

        Returns: { esquema, projeto, instalacoes }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      - name: historico
        in: query
        required: false
        schema:
          type: integer
        description: Optional. Use exactly 1 to include archived references.
      responses:
        '200':
          description: '{ esquema, projeto, instalacoes }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: 'Received inventory state contract: estado-remoto-1.'
                  projeto:
                    type: string
                    description: The owned private project.
                  instalacoes:
                    type: array
                    items:
                      type: object
                    description: 'At most three current-epoch installations: id, expira_em, confirmado_em and inventario. historico=1 also includes ativa. No secret.'
                required:
                - esquema
                - projeto
                - instalacoes
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/vigias:
    get:
      operationId: get_api_monitor_projetos_by_projeto_vigias
      summary: Read explicit inventory links and your active catalog watches
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. At most three current-epoch installations, 500 links per installation and 1,000 watches. Only the signed-in owner can read these links. A watch ID or inventory name does not prove that the tools match. An expired watch leaves its link inactive.

        Returns: { esquema, projeto, alvos, instalacoes }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      responses:
        '200':
          description: '{ esquema, projeto, alvos, instalacoes }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: 'Link state contract: vigias-inventario-1.'
                  projeto:
                    type: string
                    description: The owned private project.
                  alvos:
                    type: array
                    items:
                      type: object
                    description: 'Active owned catalog watches: id and valido_ate (expiry in Unix seconds). No private account information.'
                  instalacoes:
                    type: array
                    items:
                      type: object
                    description: 'Active installations: id and vinculos. Each link has item, alvo and ativa. No credential.'
                required:
                - esquema
                - projeto
                - alvos
                - instalacoes
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
    post:
      operationId: post_api_monitor_projetos_by_projeto_vigias
      summary: Link one received inventory item to an existing watch, or remove its link
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Requires the human account cookie and CSRF. Installation tokens and wide API keys cannot select watches. The item must be present in this active installation. The watch must already be active and owned by the account. Set alvo to null to remove a link, including after item removal. An exact retry writes nothing. Changed links share the global 512 registrations per day. This creates no watch, charge or approval.

        Returns: { vinculado }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instalacao:
                  type: string
                  description: 'Owned installation ID: 32 lower-case hexadecimal characters.'
                item:
                  type: string
                  description: 'Received inventory item ID: 64 lower-case hexadecimal characters.'
                alvo:
                  type:
                  - string
                  - 'null'
                  description: Existing watch ID, or null to remove the link.
              required:
              - instalacao
              - item
              - alvo
      responses:
        '200':
          description: '{ vinculado }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vinculado:
                    type: boolean
                    description: True when linked; false when the link is absent.
                required:
                - vinculado
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: Inventory is absent, the selected watch is inactive or the link limit is reached.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/eventos:
    get:
      operationId: get_api_monitor_projetos_by_projeto_eventos
      summary: Read committed inventory changes and native actions after a private project…
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Use the account cookie or, when configured, an mmq_ bearer reader for this project. Installation tokens cannot read the project cursor. Do not mix the reader with cookies or X-API-Key. Keyset pagination, up to five batches and 4 MiB per response. Store the returned cursor; the next page retains any batch omitted by the byte limit. Zero starts at available history. Future cursors fail. Expired history returns 410 with cursor_inicial; it is not an empty unchanged result. Events become eligible for deletion after 45 days. Reread the same page to check current notice state without creating another event or send.

        Returns: { esquema, projeto, itens[{esquema,numero,instalacao,lote,sequencia,quando,cobertura,cobertura_alertas?,mudancas,acoes?,vigias?,aviso}], cursor, anterior_expirado, avisos_ativos }'
      security:
      - globalAccount: []
      - monitorReader: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      - name: desde
        in: query
        required: false
        schema:
          type: integer
        description: Last confirmed project cursor. Start with zero.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
        description: Maximum batches per response, from 1 to 5.
      responses:
        '200':
          description: '{ esquema, projeto, itens[{esquema,numero,instalacao,lote,sequencia,quando,cobertura,cobertura_alertas?,mudancas,acoes?,vigias?,aviso}], cursor, anterior_expirado, avisos_ativos }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: 'Cursor response contract: eventos-inventario-1.'
                  projeto:
                    type: string
                    description: The owned private project.
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventoMonitor'
                    description: Committed inventory batches. evento-inventario-2 also contains up to 64 native metadata actions. Attempts, observed outcomes and monitor failures remain distinct. Notice state is current read metadata, not part of the committed event or an approval. Provider acceptance does not prove inbox delivery.
                  cursor:
                    type: integer
                    description: Cursor to store after consuming this response. An empty page marks the current end.
                  anterior_expirado:
                    type: boolean
                    description: True when starting at zero omitted already expired history. Report the coverage gap.
                  avisos_ativos:
                    type: boolean
                    description: True when the durable notice queue is configured. False means notice state is unavailable. It does not prove that account mail is enabled.
                required:
                - esquema
                - projeto
                - itens
                - cursor
                - anterior_expirado
                - avisos_ativos
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '410':
          description: History expired. Read cursor_inicial and report the coverage gap.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/instalacoes/{instalacao}/revogar:
    post:
      operationId: post_api_monitor_projetos_by_projeto_instalacoes_by_instalacao_revogar
      summary: Revoke one installation credential without changing local files
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. A repeated revocation is idempotent. New sends with this credential fail. This does not stop or uninstall the local agent, erase local state or reset the project''s cursor.

        Returns: { revogada }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      - name: instalacao
        in: path
        required: true
        schema:
          type: string
        description: An installation ID inside this owned project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ revogada }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  revogada:
                    type: boolean
                    description: True once the credential is revoked.
                required:
                - revogada
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/excluir:
    post:
      operationId: post_api_monitor_projetos_by_projeto_excluir
      summary: Delete an owned project and its private monitor data
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Requires authentication within five minutes, CSRF and exact empty JSON. Stop all project credentials immediately. Remove at most 64 events and 64 installations per call. Pending erasure resumes hourly, including after account deactivation. Local files, legacy watches and purchased credits remain. Installation tokens cannot erase a project.

        Returns: { excluido, pendente, eventos, instalacoes, acoes }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ excluido, pendente, eventos, instalacoes, acoes }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  excluido:
                    type: boolean
                    description: True when the project and all its private records are gone.
                  pendente:
                    type: boolean
                    description: True while bounded erasure must continue. New sends remain disabled.
                  eventos:
                    type: integer
                    description: Events removed in this batch, at most 64.
                  instalacoes:
                    type: integer
                    description: Installations removed in this batch, at most 64.
                  acoes:
                    type: integer
                    description: Native action IDs removed, at most 64. Optional.
                required:
                - excluido
                - pendente
                - eventos
                - instalacoes
                - acoes
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/instalacao:
    get:
      operationId: get_api_monitor_instalacao
      summary: Check the narrow credential and its confirmed remote reference
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. The fixed client authority is https://api.agentalog.com. This route returns no inventory, owner information or secret. Account epoch, revocation and expiry are checked on every call. A read does not update presence.

        Returns: { esquema, projeto, instalacao, sequencia, lote, expira_em }'
      security:
      - monitorInstallation: []
      responses:
        '200':
          description: '{ esquema, projeto, instalacao, sequencia, lote, expira_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: 'Reference contract: instalacao-remota-1.'
                  projeto:
                    type: string
                    description: The credential's single project.
                  instalacao:
                    type: string
                    description: The credential's installation.
                  sequencia:
                    type: integer
                    description: Last committed installation sequence, zero before the first batch.
                  lote:
                    type: string
                    description: Last committed batch ID, null before the first batch.
                    nullable: true
                  expira_em:
                    type: integer
                    description: Credential expiry timestamp in Unix seconds.
                required:
                - esquema
                - projeto
                - instalacao
                - sequencia
                - lote
                - expira_em
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/inventario:
    post:
      operationId: post_api_monitor_inventario
      summary: Commit one bounded private inventory batch and return its receipt
      description: 'Private and no-store. No catalog quota, paid read, public cache or CORS grant. Send only a persisted lote-1 or lote-2 body from the client outbox. lote-1 has no actions; lote-2 requires 1 to 64 distinct actions and the optional action receiver. The server checks the sequence and preceding ID, preserves incomplete sources and acknowledges after commit. Exact replays return the same receipt without an extra event or budget debit. Native IDs are deduplicated across batches. A changed action under the same ID returns 409. New actions share the global 512 registrations per day. Extra fields, raw URLs, local paths and raw arguments fail. Global limit: 256 batches and 32 MiB logical bytes per day. Per installation: 20 batches per day and 600 before expiry.

        Returns: { id, sequencia, numero }'
      security:
      - monitorInstallation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                esquema:
                  type: string
                  description: Persisted batch version. lote-2 requires the optional native action receiver.
                  enum:
                  - lote-1
                  - lote-2
                id:
                  type: string
                  description: Persisted 64-character batch ID. Keep it unchanged on retry.
                sequencia:
                  type: integer
                  description: Next positive installation sequence, in order.
                anterior:
                  type:
                  - string
                  - 'null'
                  description: Previous persisted batch ID, null for the first batch.
                inventario:
                  type: object
                  description: 'Normalized inventario-1 from the client: agente, itens and cobertura. Item types: mcp, skill, plugin, dependencia or configuracao. Configuration contains only its hash, fixed categories and selected destination domains. Maximum 500 items and 1 MiB.'
                acoes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AcaoMonitor'
                  description: Required only for lote-2; forbidden in lote-1. From 1 to 64 distinct native metadata events. No prompts, transcripts, raw arguments, local paths or output text.
              required:
              - esquema
              - id
              - sequencia
              - anterior
              - inventario
      responses:
        '200':
          description: '{ id, sequencia, numero }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Exactly the submitted batch ID.
                  sequencia:
                    type: integer
                    description: Exactly the submitted installation sequence.
                  numero:
                    type: integer
                    description: Committed project cursor assigned under its transaction lock.
                required:
                - id
                - sequencia
                - numero
        '400':
          description: Invalid field, cursor or bounded request body.
        '401':
          description: A valid account session or installation credential is required.
        '403':
          description: Origin or CSRF proof is invalid for a human write.
        '404':
          description: The project or installation does not belong to this account.
        '409':
          description: The project, installation or sequence limit prevents the operation.
        '429':
          description: The daily budget is exhausted. Preserve pending local batches.
        '503':
          description: Monitoring is unavailable. Preserve the previous state and retry.
      tags:
      - Monitor
  /api/monitor/projetos/{projeto}/consultas:
    get:
      operationId: get_api_monitor_projetos_by_projeto_consultas
      summary: List your project's event readers without their secrets
      description: 'Private, no-store and no CORS grant. The optional project event reader must be configured. Installation tokens and wide API keys cannot manage readers. At most 64 records. No last-used tracking or write on read.

        Returns: { consultas }'
      security:
      - globalAccount: []
      parameters:
      - name: projeto
        in: path
        required: true
        schema:
          type: string
        description: Private project ID owned by the signed-in account.
      responses:
        '200':
          description: '{ consultas }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultas:
                    type: array
                    items:
                      type: object
                    description: Reader id, criado_em, expira_em (Unix seconds) and ativa. No token or digest.
                required:
                - consultas
        '400':
          description: Unknown field or invalid bounded request.
        '401':
          description: Sign in with the existing account. Issuance and revocation require authentication within five minutes.
        '403':
          description: Origin or CSRF proof is invalid.
        '404':
