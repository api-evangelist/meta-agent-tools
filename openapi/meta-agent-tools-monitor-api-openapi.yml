  /api/monitor/avisos/reivindicar:
    post:
      operationId: post_api_monitor_avisos_reivindicar
      summary: Reserve at most one committed notice for the existing product mail service
      description: 'Private and no-store. Set ORIGIN to the fixed service authority https://api.agentalog.com. Dedicated service only; no customer or MCP tool authority. Exact empty JSON and no query. Reads the indexed pending range, then revalidates account epoch, project and installation. MAT covers changes after the initial reference and native observations that need attention, including unlinked items. Approved routine activity stays in the private cursor without mail. Active human-selected watch links add catalog context; they are optional. Empty polling writes nothing. Reservation lasts two minutes. Reply contains bounded event metadata, owner ID and reservation proof, never email or installation credentials. No send occurs here.

        Returns: { aviso }'
      security:
      - monitorNotices: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ aviso }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  aviso:
                    type: object
                    description: Null when no eligible notice exists; otherwise produto, projeto, numero, lease, dono, nome and evento. Maximum 4 MiB.
                    nullable: true
                required:
                - aviso
        '400':
          description: Invalid bounded JSON, receipt, result or query.
        '401':
          description: The dedicated product notice credential is absent or invalid.
        '405':
          description: Only POST is permitted.
        '409':
          description: The reservation expired or the project or installation is no longer active.
        '413':
