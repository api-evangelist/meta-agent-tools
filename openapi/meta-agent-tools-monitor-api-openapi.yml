          description: '{ autorizado, vigias }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  autorizado:
                    type: boolean
                    description: True only after the send intent is durably recorded.
                  vigias:
                    type: array
                    items:
                      type: object
                    description: Zero to 500 active item/alvo pairs; a subset of the committed event links.
                required:
                - autorizado
                - vigias
        '400':
          description: Invalid bounded JSON, receipt, result or query.
        '401':
          description: The dedicated product notice credential is absent or invalid.
        '405':
          description: Only POST is permitted.
        '409':
          description: The reservation expired or the project or installation is no longer active.
        '413':
          description: The request body exceeds 4 KiB.
        '415':
          description: Content-Type must be application/json.
        '429':
          description: The shared daily reservation or delivery-attempt budget is exhausted. No send is authorized.
        '503':
          description: Notice delivery is unavailable or another service operation is active.
      tags:
      - Monitor
  /api/monitor/avisos/finalizar:
    post:
      operationId: post_api_monitor_avisos_finalizar
      summary: Confirm the result of the single reserved mail attempt
      description: 'Private and no-store. Accept enviado, adiado, rejeitado or incerto. enviado means provider acceptance, not inbox delivery. adiado is valid only when no send occurred: retry after one hour, with at most six reservations. rejeitado discards the notice. incerto prevents automatic resend. A late matching receipt can confirm an uncertain send. Exact confirmation replay does not write or extend a deadline.

        Returns: { estado }'
