                  description: 'Reserved private project ID: 32 hexadecimal characters.'
                numero:
                  type: integer
                  description: Reserved positive committed event number.
                lease:
                  type: string
                  description: 'Private reservation proof: 64 hexadecimal characters.'
                resultado:
                  type: string
                  description: Observed mail result. Never infer success after a timeout.
                  enum:
                  - enviado
                  - adiado
                  - rejeitado
                  - incerto
              required:
              - projeto
              - numero
              - lease
              - resultado
      responses:
        '200':
          description: '{ estado }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    description: Durably confirmed current notice state.
                    enum:
                    - enviado
                    - pendente
                    - descartado
                    - incerto
                required:
                - estado
        '400':
          description: Invalid bounded JSON, receipt, result or query.
        '401':
