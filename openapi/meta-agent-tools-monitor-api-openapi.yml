      operationId: get_api_monitor_politica
      summary: Read a signed short-lived policy for this installation only
      description: 'Private and no-store. Set ORIGIN to https://api.agentalog.com. Exact path, no query and no write. Revalidate credential expiry, revocation and account epoch on each read. Ed25519 signature; at most 500 rules, 1 MiB and 15 minutes, shortened to credential expiry. Client 0.4.0 pins the public key and verifies product/project/installation/epoch through its trusted connection. Reject expired, future, changed, differently scoped or older policies. An already cached policy can remain valid until expiry after an online revocation. policy downloads a signed decision. check recollects the selected configurations and target item before checking their exact candidates. The policy and check commands do not activate tools or install hooks. Optional hooks-install can install project hooks after preview consent. In enforce mode, covered calls require exact reviewed configuration and tool metadata. Removing a reviewed configuration prevents confirmation until that configuration is restored and reviewed. This does not freeze a remote MCP''s code or guarantee universal blocking. Available only when the optional review service is configured.

        Returns: { esquema, politica, assinatura }'
      security:
      - monitorInstallation: []
      responses:
        '200':
          description: '{ esquema, politica, assinatura }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  esquema:
                    type: string
                    description: Signed envelope contract.
                    enum:
                    - politica-assinada-1
                  politica:
                    type: object
                    description: 'politica-inventario-1: produto, projeto, instalacao, epoca, versao, emitida_em, expira_em and revisoes. Rules contain exact item metadata, candidate fingerprint, human decision, responsible account, decision timestamp and number.'
                  assinatura:
                    type: string
                    description: 86 base64url characters. Verify with the separately trusted Ed25519 public key; never trust a key supplied by an untrusted envelope.
                required:
                - esquema
                - politica
                - assinatura
        '400':
          description: Unexpected query.
        '401':
          description: The installation credential is absent, expired or revoked.
        '405':
          description: Only GET is permitted.
        '503':
          description: The optional review service is unconfigured or unavailable.
      tags:
      - Monitor
components:
  schemas:
    EventoMonitor:
      type: object
      properties:
        esquema:
          type: string
          description: Legacy inventory event or inventory event with native actions.
          enum:
          - evento-inventario-1
          - evento-inventario-2
        numero:
          type: integer
          description: Committed project cursor.
        instalacao:
          type: string
          description: 'Installation ID: 32 hexadecimal characters.'
        lote:
          type: string
          description: 'Persisted batch ID: 64 hexadecimal characters.'
        sequencia:
          type: integer
          description: Positive installation sequence.
        quando:
          type: integer
          description: Commit timestamp in Unix seconds.
        cobertura:
          type: array
          items:
            type: object
          description: At most 16 inventory source coverage entries.
        cobertura_alertas:
          type: array
          items:
            type: object
          description: At most 16 newly incomplete or changed incomplete sources. Repeated unchanged gaps do not trigger another notice.
        mudancas:
          type: array
          items:
            type: object
          description: Normalized inventory differences. Declaration is not execution.
        acoes:
          type: array
          items:
            $ref: '#/components/schemas/AcaoMonitor'
          description: Present only in evento-inventario-2. At most 64 newly admitted actions; cross-batch duplicates are omitted.
        vigias:
          type: array
          items:
            type: object
          description: item/alvo links active at commit, when link service is configured.
        aviso:
          type: object
          description: 'Current {estado}: pendente, preparando, enviando, incerto, enviado or descartado. Null without a notice. enviado means provider acceptance, not inbox delivery.'
          nullable: true
      required:
      - esquema
      - numero
      - instalacao
      - lote
      - sequencia
      - quando
      - cobertura
      - mudancas
      - aviso
      description: One committed private batch. Consume the whole batch before advancing its project cursor.
    AcaoMonitor:
      type: object
      properties:
        id:
          type: string
          description: 'Stable event ID: 64 lower-case hexadecimal characters.'
        sessao:
          type: string
          description: 'Hashed native session identity: 64 hexadecimal characters.'
        chamada:
          type: string
          description: Hashed native tool-call ID. Null for an event without a native call ID.
          nullable: true
        item:
          type: string
          description: Captured inventory item ID. Null when sha is null.
          nullable: true
        sha:
          type: string
          description: Captured content hash. Null when item is null.
          nullable: true
        evento:
          type: string
          description: Native event type. Stop delivers batches but creates no activity event.
          enum:
          - SessionStart
          - SessionEnd
          - ConfigChange
          - PreToolUse
          - UserPromptExpansion
          - PostToolUse
          - PostToolUseFailure
        evidencia:
          type: string
          description: Must match evento. An attempt does not prove execution.
          enum:
          - sessao
          - configuracao
          - tentativa
          - execucao_observada
          - falha_observada
        estado:
          type: string
          description: Captured monitor state. observado is observation only; falha reports monitor failure.
          enum:
          - observado
          - aprovado
          - pendente
          - suspenso
          - ausente
          - incompleto
          - origem_nao_confirmada
          - falha
        politica_versao:
          type: integer
          description: Non-negative signed policy version, or null when unavailable.
          nullable: true
        observado_em:
          type: integer
          description: Original positive observation time in Unix seconds.
      required:
      - id
      - sessao
      - chamada
      - item
      - sha
      - evento
      - evidencia
      - estado
      - politica_versao
      - observado_em
      description: A native hook observation. It does not certify safety or prove universal enforcement.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
