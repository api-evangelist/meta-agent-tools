openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Servers API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Servers
paths:
  /v0.1/servers:
    get:
      operationId: list_mcp_servers
      summary: MCP subregistry in the Official Registry format (spec v0.1), cursor-paginated
      description: 'Only `kind=mcp` and only `live`. It is the route a generic MCP client knows how to read without knowing this product. `GET /v0/servers` is an alias of the same resource, kept for whoever already pointed there — this is the canonical URL.

        Returns: { servers[{name,description,version,repository,remotes,packages}], metadata }'
      security: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Free text over the server's name and description.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor of the next page, from `metadata.next_cursor`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Servers per page.
      - name: X-API-Pass
        in: header
        required: false
        schema:
          type: string
        description: 'MAT-only private pass: mat_<32 random hex>_<64 random hex>. Generate and save before buying.'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Optional retry key, up to 80 ASCII characters; same read for five minutes.
      responses:
        '200':
          description: '{ servers[{name,description,version,repository,remotes,packages}], metadata }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaV01'
        '401':
          description: Invalid MAT pass.
        '402':
          description: Free allowance or MAT credits exhausted; buy a package.
        '409':
          description: Retry conflict or pending read.
        '413':
          description: Basic read exceeds 1 MiB.
        '429':
          description: Temporary reading capacity.
        '503':
          description: Origin or payment verification temporarily unavailable.
      tags:
      - Servers
components:
  schemas:
    ServidorV01:
      type: object
      properties:
        name:
          type: string
          description: Server name in namespace/name format.
        description:
          type: string
          description: What the server does.
          nullable: true
        version:
          type: string
          description: Declared version.
          nullable: true
        repository:
          type: object
          description: Where the code lives.
          nullable: true
        remotes:
          type: array
          items:
            type: object
          description: The server's remote endpoints, when any.
          nullable: true
        packages:
          type: array
          items:
            type: object
          description: The server's installable packages, when any.
          nullable: true
      required:
      - name
      - description
      - version
      - repository
      - remotes
      - packages
      description: An MCP server in the Official Registry format (spec v0.1) — what a generic MCP client expects to read.
    PaginaV01:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServidorV01'
          description: The servers on this page.
        metadata:
          type: object
          description: '`next_cursor` and `count`, in the spec''s format.'
      required:
      - servers
      - metadata
      description: The subregistry page, cursor-paginated as the v0.1 spec requires.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - ai-agents
  - mcp
  - directory
  docs:
    homepage: https://agentalog.com/
    apiReference: https://agentalog.com/developers
    llms: https://agentalog.com/llms.txt
