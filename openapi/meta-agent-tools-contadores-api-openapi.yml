openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Contadores API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Contadores
paths:
  /api/contadores:
    get:
      operationId: get_api_contadores
      summary: Likes, comments and visits of every listing that has any, read from where they…
      description: 'Counters include visits, likes and comments. The app and catalog read the same counter table; there is no collection delay. Only listings with a counter above zero are returned. Smoke traffic never counts. Cached for 60 seconds.

        Returns: { gerado_em, total, truncado, itens }'
      security: []
      responses:
        '200':
          description: '{ gerado_em, total, truncado, itens }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contadores'
      tags:
      - Contadores
components:
  schemas:
    Contadores:
      type: object
      properties:
        gerado_em:
          type: string
          description: When this list was read (ISO 8601).
        total:
          type: integer
          description: Listings in `itens`.
        truncado:
          type: boolean
          description: More listings have counters than the 20,000 returned.
        itens:
          type: array
          items:
            type: object
          description: 'One entry per listing with any counter: `id`, `likes`, `comments`, `visits`.'
      required:
      - gerado_em
      - total
      - truncado
      - itens
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - ai-agents
  - mcp
  - directory
  docs:
    homepage: https://agentalog.com/
    apiReference: https://agentalog.com/developers
    llms: https://agentalog.com/llms.txt
