openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Fila API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Fila
paths:
  /api/fila:
    get:
      operationId: get_api_fila
      summary: 'The public snapshot of the enrichment queue: how much of the catalog has been…'
      description: 'It is public because it is about the catalog''s health, not about anyone: aggregate numbers only, no identifiable listing.

        Returns: { ok, fila{total,concluidos,vencidos,com_falha,processados,estados,motivos} }'
      security: []
      responses:
        '200':
          description: '{ ok, fila{total,concluidos,vencidos,com_falha,processados,estados,motivos} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoFila'
      tags:
      - Fila
components:
  schemas:
    EstadoFila:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true` when there is a snapshot.
        fila:
          allOf:
          - $ref: '#/components/schemas/RetratoFila'
          description: The queue's numbers.
      required:
      - ok
      - fila
      description: 'The snapshot of the enrichment queue: how many listings have been checked and what is known about them.'
    RetratoFila:
      type: object
      properties:
        total:
          type: integer
          description: Listings in the queue.
        concluidos:
          type: integer
          description: Already checked.
        vencidos:
          type: integer
          description: With an expired check, waiting for a new pass.
        com_falha:
          type: integer
          description: That failed the check.
        processados:
          type: integer
          description: Processed in the current window.
        estados:
          type: object
          description: 'Count per `repo_estado`: ativo, parado, arquivado, renomeado, sumiu.'
        motivos:
          type: object
          description: Count per reason the listing is in the state it is in.
      required:
      - total
      - concluidos
      - vencidos
      - com_falha
      - processados
      - estados
      - motivos
      description: Counters of the enrichment queue, pushed by the robot that checks the repositories.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - ai-agents
  - mcp
  - directory
  docs:
    homepage: https://agentalog.com/
    apiReference: https://agentalog.com/developers
    llms: https://agentalog.com/llms.txt
x-provenance:
  method: harvested
  publisher: Meta Agent Tools
  source: https://agentalog.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
