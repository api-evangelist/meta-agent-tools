openapi: 3.2.0
info:
  title: Agentalog — Agent Auto Log Erro Cliente API
  version: 1.0.0
  description: 'Agent Auto Log: catalog of MCP servers, skills and plugins with an automatic change log, plus a monitor for what your agents install.'
servers:
- url: https://agentalog.com
tags:
- name: Erro Cliente
paths:
  /api/erro-cliente:
    post:
      operationId: post_api_erro_cliente
      summary: Browser error report, sent by the interface itself. Agents need not call it
      description: 'The interface reports on its own JS errors, unhandled rejections, scripts/CSS that failed to load and CSP blocks — once per session — and the app reports handled failures through `window.mmErro.relata`. The server validates the envelope, redacts credentials, e-mails and phone numbers, merges repeats of the same failure per minute and records an operational event; nothing is written to a database. It keeps no IP, cookie, query string or full User-Agent. Always answers 204, even for an invalid report.

        Returns: 204 with no body, always — an invalid, repeated or over-cap report also gets 204.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Failure code, `UI-` + letters/digits (`UI-JS-001` global error, `UI-PROMESSA-001`, `UI-RECURSO-001`, `UI-CSP-001`, `UI-APP-001` app report).
                phase:
                  type: string
                  description: 'Where it broke, lowercase: `global`, `promessa`, `script`, `load_list`…'
                path:
                  type: string
                  description: Path of the open page, without query; numbers, hashes and tokens in it are kept as `:id`.
                message:
                  type: string
                  description: Error message, up to 2000 characters.
                stack:
                  type: string
                  description: Stack trace, up to 12000 characters.
                source:
                  type: string
                  description: Originating script; only its path is kept.
                line:
                  type: integer
                  description: Line in the originating script.
                column:
                  type: integer
                  description: Column in the originating script.
                visivel:
                  type: boolean
                  description: Whether the tab was visible when it broke.
                build:
                  type: string
                  description: Build of the reporting page (its `<meta name="build">`), up to 64 letters, digits, `.`, `_` or `-`; it dates the failure.
              required:
              - code
              - phase
            example:
              code: UI-APP-001
              phase: carregar_lista
              path: /
              message: lista 500
      responses:
        '200':
          description: 204 with no body, always — an invalid, repeated or over-cap report also gets 204.
      tags:
      - Erro Cliente
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Guest mr_… or ADMIN_TOKEN; the account is a cookie, never a bearer.
    monitorReader:
      type: http
      scheme: bearer
      bearerFormat: mmq_…
      description: Read one private project's event cursor only. No ingestion, approval or purchase. Do not mix with cookies.
    monitorInstallation:
      type: http
      scheme: bearer
      bearerFormat: mmi_…
      description: One private installation and project. No approval, purchase or credential issuance.
    monitorNotices:
      type: http
      scheme: bearer
      bearerFormat: mmn_…
      description: Product notice service only. Reserve, start and confirm; no account or installation authority.
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment per call (USDC on Base). Call without it to get the 402 with `accepts`; sign the authorization and repeat with the base64 payment in X-PAYMENT.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - ai-agents
  - mcp
  - directory
  docs:
    homepage: https://agentalog.com/
    apiReference: https://agentalog.com/developers
    llms: https://agentalog.com/llms.txt
